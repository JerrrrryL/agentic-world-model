# Generated by hv/adapters/airs.py for TextualClassificationSickAccuracy.
# The agent-visible data is prepared once on the host by
#   python -m hv.adapters.airs stage --task <task>
# and mounted read-only. Gold labels are NOT here: they ride in tests/, which
# Harbor uploads only for the verifier phase.
#
# HV_AIRS_PREPARED must be an ABSOLUTE host path -- compose resolves a relative
# volume source against this file's directory, which would bind nothing and let
# the task score 0 on a missing submission instead of failing. `hv run` sets it;
# calling harbor directly needs --env-file or an exported value.
services:
  main:
    volumes:
      - ${HV_AIRS_PREPARED:?set to the absolute path of data/assets/airs/prepared}/TextualClassificationSickAccuracy:/app/data:ro
